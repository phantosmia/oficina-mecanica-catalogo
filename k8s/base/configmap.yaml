apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogo-config
  namespace: oficina-catalogo
data:
  AWS_REGION: us-east-1
  # Sobrescritos pelo overlay com os outputs do Terraform do serviço.
  CATALOG_TABLE_NAME: oficina-catalogo
  CATALOG_EVENTS_TOPIC_ARN: ""
  ADMIN_USERNAME: admin
  JWT_ALGORITHM: HS256
  LOG_LEVEL: INFO
  # ADR-0007: só ativa de fato com NEW_RELIC_LICENSE_KEY (secret) definida.
  NEW_RELIC_APP_NAME: oficina-mecanica-catalogo
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
