# Relay da outbox: publica no SNS os eventos gravados pela API (README,
# "Outbox e publicação de eventos"). Uma réplica só, sem HPA: várias réplicas
# só gerariam publicações duplicadas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-outbox-relay
  namespace: oficina-catalogo
  labels:
    app.kubernetes.io/name: catalogo-outbox-relay
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: catalogo-outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalogo-outbox-relay
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      containers:
        - name: relay
          image: oficina-mecanica-catalogo:latest
          imagePullPolicy: Always
          args: ["relay"]
          envFrom:
            - configMapRef:
                name: catalogo-config
            - secretRef:
                name: catalogo-secret
          env:
            - name: NEW_RELIC_APP_NAME
              value: oficina-mecanica-catalogo-outbox-relay
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
